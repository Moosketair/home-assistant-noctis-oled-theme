      sidebar-selected-icon-color: "#D8973D"
      sidebar-selected-text-color: "#E1E8EE"
      paper-listbox-background-color: "#111A24"
      paper-card-background-color: "#111B25"
      paper-dialog-background-color: "#111B25"
      paper-item-icon-color: "#91A2B1"
      paper-item-icon-active-color: "#D8973D"
      paper-grey-50: "#111A24"
      paper-grey-200: "#263542"
